name: Deploy static content to Pages

on:
  push:
    branches: ["main"] # ※お使いのメインブランチ名が master の場合は "master" に変更してください

  # 手動実行用
  workflow_dispatch:

# ★重要：同じPagesデプロイが重複した際、古い実行を自動キャンセルして競合を防ぐ
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
