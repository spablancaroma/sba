name: Deploy static content to Pages

on:
  push:
    branches: ["main"] # ※お使いのメインブランチ名が master の場合は "master" に書き換えてください

  workflow_dispatch:

# 重複デプロイエラーを防ぐ同時実行制御
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ルート直下の HTML / CSS ファイル等をアップロード
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
