    <script>
      function openNav() {
        document.getElementById('sidebar').classList.add('is-active');
        document.getElementById('overlay').classList.add('is-active');
      }

      function closeNav() {
        document.getElementById('sidebar').classList.remove('is-active');
        document.getElementById('overlay').classList.remove('is-active');
      }

      function loginAdmin() {
        const pass = prompt("管理者用パスワードを入力してください:");
        if (pass === "blanc2025") {
          sessionStorage.setItem("adminAuth", "true");
          window.location.href = "../admin.html";
        } else if (pass !== null) {
          alert("パスワードが正しくありません。");
        }
      }

      const ITEMS_PER_PAGE = 5; 
      let currentPage = 1;

      function renderPagination() {
        const list = document.getElementById('voiceList');
        const cards = Array.from(list.querySelectorAll('.voice-card'));
        const totalPages = Math.ceil(cards.length / ITEMS_PER_PAGE);
        const paginationContainer = document.getElementById('pagination');

        if (totalPages <= 1) {
          paginationContainer.style.display = 'none';
          cards.forEach(card => card.style.display = 'block');
          return;
        }

        paginationContainer.style.display = 'flex';

        cards.forEach((card, index) => {
          const start = (currentPage - 1) * ITEMS_PER_PAGE;
          const end = start + ITEMS_PER_PAGE;
          if (index >= start && index < end) {
            card.style.display = 'block';
          } else {
            card.style.display = 'none';
          }
        });

        paginationContainer.innerHTML = '';

        const prevBtn = document.createElement('button');
        prevBtn.textContent = '＜';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
          currentPage--;
          renderPagination();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        paginationContainer.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
          const pageBtn = document.createElement('button');
          pageBtn.textContent = i;
          if (i === currentPage) {
            pageBtn.classList.add('active');
          }
          pageBtn.onclick = () => {
            currentPage = i;
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
          paginationContainer.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.textContent = '＞';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
          currentPage++;
          renderPagination();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        paginationContainer.appendChild(nextBtn);
      }

      document.addEventListener('DOMContentLoaded', renderPagination);
    </script>
